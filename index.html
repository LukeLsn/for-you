<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey to Feb 14</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1021;
            --locked-color: rgba(255, 255, 255, 0.2);
            --unlocked-color: #ff4d6d;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white;
            font-family: 'Playfair Display', serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        h1 { font-weight: normal; font-style: italic; margin-bottom: 50px; text-align: center; opacity: 0.9; }

        .path-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            width: 100%;
            max-width: 400px;
        }

        /* The dotted line connecting hearts */
        .path-container::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; width: 2px;
            border-left: 2px dashed rgba(255,255,255,0.1);
            z-index: 0;
        }

        .milestone {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 100px; /* Constrains the clickable area */
        }

        .heart-node {
            width: 40px;
            height: 40px;
            background: var(--locked-color);
            position: relative;
            transform: rotate(-45deg);
            transition: all 0.5s ease;
            margin-bottom: 20px; /* Creates consistent space for the label */
        }
		
		/* Standard CSS Heart Shape */
        .heart-node::before,
        .heart-node::after {
            content: "";
            width: 40px;
            height: 40px;
            background: inherit;
            border-radius: 50%;
            position: absolute;
        }
        .heart-node::before { top: -20px; left: 0; }
        .heart-node::after { left: 20px; top: 0; }

        .milestone.unlocked .heart-node {
            background: var(--unlocked-color);
            box-shadow: 0 0 20px var(--unlocked-color);
        }

        .date-label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            margin-top: 10px; /* Pulls the text closer to the heart */
        }

        /* Styles for Unlocked Hearts */
        .milestone.unlocked .heart-node {
            background: var(--unlocked-color);
            box-shadow: 0 0 20px var(--unlocked-color);
            filter: drop-shadow(0 0 10px var(--unlocked-color));
        }

        .milestone.unlocked:hover { transform: scale(1.1); }

        .date-label {
            margin-top: 35px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.6);
        }

        .milestone.unlocked .date-label { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Locked Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        #toast {
            visibility: hidden;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 12px 25px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            font-size: 0.9rem;
        }

        #toast.show { visibility: visible; animation: fadeInOut 2s; }

        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 0; }
        }
    </style>
</head>
<body>

    <h1>Our Valentine's Roadmap</h1>

    <div class="path-container" id="roadmap">
        </div>

    <div id="toast">Patience, Ella... it's not time yet. ❤️</div>

    <script>
        const milestones = [
            { date: '2026-02-01', label: 'FEB 01', link: './memory1.html' },
            { date: '2026-02-03', label: 'FEB 03', link: './memory2.html' },
            { date: '2026-02-05', label: 'FEB 05', link: './memory3.html' },
            { date: '2026-02-07', label: 'FEB 07', link: './memory4.html' },
            { date: '2026-02-09', label: 'FEB 09', link: './memory5.html' },
            { date: '2026-02-11', label: 'FEB 11', link: './memory6.html' },
            { date: '2026-02-14', label: 'THE FINALE', link: './letter.html' }
        ];

        const container = document.getElementById('roadmap');
        const now = new Date();

        milestones.forEach((m, index) => {
            const mDate = new Date(m.date);
            const isUnlocked = now >= mDate;

            const div = document.createElement('div');
            div.className = `milestone ${isUnlocked ? 'unlocked' : 'locked'}`;
            div.innerHTML = `
                <div class="heart-node"></div>
                <div class="date-label">${m.label}</div>
            `;

            div.onclick = () => {
                if (isUnlocked) {
                    window.location.href = m.link;
                } else {
                    div.classList.add('shake');
                    setTimeout(() => div.classList.remove('shake'), 400);
                    showToast();
                }
            };

            container.appendChild(div);
        });

        function showToast() {
            const x = document.getElementById("toast");
            x.className = "show";
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 2000);
        }
    </script>
</body>
</html>
