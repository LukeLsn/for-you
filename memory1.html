<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Moment for Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .content-card {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 { font-style: italic; font-size: 1.5rem; color: #ff4d6d; }
        p { line-height: 1.6; opacity: 0.8; }

        .back-btn {
            margin-top: 30px;
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 50px;
        }
		
		.spotify-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #1DB954;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .spotify-btn:hover {
            background-color: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
        }

        .spotify-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="content-card">
        <h1>Feb 01: The Beginning</h1>
        <p>The soundtrack of us. This is our original collection—every song we've added and every one yet to come. Press play and let's start our journey to the 14th.</p>

        <br>
        <a href="index.html" class="back-btn">← Back to Roadmap</a>
    </div>
</body>
</html>
