<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

    <style>
        .photo-frame {
            background: white;

    <div class="content-card">
        <div class="movie-badge">Movie Night</div>
        
        <div class="photo-frame">
            <img src="./m3p/1.jpg" alt="Watching A Dog's Purpose">
        </div>

        <h1>Feb 05: Shared Silence</h1>
